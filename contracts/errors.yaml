# Error-code registry (maint-01): single source of truth for the
# COBOL -> HTTP error contract. Generated from ERROR_STATUS plus the 30
# mapped codes; never hand-edit without updating result.js and result.test.js.
# Validate with scripts/check_error_codes.mjs.
# Fields: status (HTTP), origin (cobol = emitted by COBOL, gateway = raised
# in middleware, internal = bridge sentinel, never surfaced).
