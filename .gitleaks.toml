# gitleaks configuration (P1-6). Gate: no secrets in the worktree.
# (`gitleaks detect --source . --no-git --config .gitleaks.toml`.)
[extend]
useDefault = true

[allowlist]
description = "P1-4 migration checksums: seed lines shaped name', 'hash' in database/schema.sql — public migration file hashes, not secrets (gitleaks matches the name+hash span, so target the match, not the line)"
regexTarget = "match"
regexes = ['''^[0-9a-z_]+', '[0-9a-f]{64}'$''']
