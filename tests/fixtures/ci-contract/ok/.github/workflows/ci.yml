name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  DB_SHARD_COUNT: 2
jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
  db-shards:
    name: db shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run DB shard
        run: DB_SHARD_INDEX=${{ matrix.shard }} tests/run_all.sh db-shard
  db-aggregate:
    name: db aggregate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check upstream results
        id: upstream
        if: always()
        run: |
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - name: Download all reports
        if: always() && steps.upstream.outputs.ok == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: "*-reports*"
          path: parts/
          retention-days: 1
      - name: Merge and verify shard reports
        if: always() && steps.upstream.outputs.ok == 'true'
        run: bash scripts/ci/aggregate_shard_reports.sh parts merged "$DB_SHARD_COUNT"
      - name: Assertion count gate
        if: always() && steps.upstream.outputs.ok == 'true'
        run: node scripts/check_test_counts.mjs --report-dir merged --strict
      - name: Write test summary
        if: always() && steps.upstream.outputs.ok == 'true'
        run: node scripts/ci/summary.mjs --report-dir merged
      - name: Upload merged reports
        if: always() && steps.upstream.outputs.ok == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: test-reports-merged
          overwrite: true
          path: merged/
          retention-days: 14
          if-no-files-found: warn
  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
  coverage-pr:
    name: coverage-pr
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
