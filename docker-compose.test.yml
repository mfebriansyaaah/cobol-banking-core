services:
  db:
    image: mariadb:11.8
    container_name: cobol-banking-test-db
    restart: "no"
    environment:
      MARIADB_ROOT_PASSWORD: "${TEST_DB_ROOT_PASS:-root}"
      MARIADB_DATABASE: cobol_db
    ports:
      - "${TEST_DB_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    tmpfs:
      - /var/lib/mysql
