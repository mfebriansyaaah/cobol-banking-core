services:
  db:
    image: mariadb:11.8
    container_name: cobol-banking-test-db
    restart: "no"
    environment:
      MARIADB_ROOT_PASSWORD: "${TEST_DB_ROOT_PASS:-root}"
      MARIADB_DATABASE: cobol_db
    ports:
      - "${TEST_DB_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    tmpfs:
      - /var/lib/mysql

  # Local equivalent of the CI mailpit service (email OTP flow).
  mailpit:
    image: axllent/mailpit@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
    container_name: cobol-banking-test-mailpit
    restart: "no"
    ports:
      - "1025:1025"
      - "8025:8025"

  # Document vault (PR-096, dev only): S3-compatible MinIO, single-node.
  # Production needs distributed MinIO + real KMS; credentials below are
  # non-secret dev defaults, never production values.
  # NOTE (audit P1-09): Docker Hub minio/minio:latest is gone; quay.io is the
  # documented replacement, but quay returns HTTP 401 for anonymous manifest
  # inspection in this environment, so no digest could be verified here.
  # Owner with quay auth: replace the tag below with the pinned digest and
  # record it in the PR.
  minio:
    image: quay.io/minio/minio:latest
    container_name: cobol-banking-test-minio
    restart: "no"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"

  # Antivirus for the vault gate (PR-096, dev only).
  clamav:
    image: clamav/clamav@sha256:7054e3f34308c384ea43cd786ea17abf899bd44af40af9f1b099853d7a5c214e
    container_name: cobol-banking-test-clamav
    restart: "no"
    ports:
      - "3310:3310"
