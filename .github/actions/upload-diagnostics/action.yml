name: Upload CI diagnostics
description: Collect best-effort failure diagnostics and upload them as an artifact.
inputs:
  name:
    description: Artifact name
    required: false
    default: diagnostics
  path:
    description: Diagnostics output directory
    required: false
    default: /tmp/ci-diagnostics
  retention-days:
    description: Artifact retention
    required: false
    default: '7'
runs:
  using: composite
  steps:
    - name: Collect diagnostics
      shell: bash
      run: |
        set -euo pipefail
        bash scripts/ci/collect_diagnostics.sh "${{ inputs.path }}"
    - name: Upload diagnostics
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: warn
        overwrite: true
