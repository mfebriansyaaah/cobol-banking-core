name: Bootstrap test database
description: Download snapshot, restore or rebuild schema, provision grants, optionally seed.
inputs:
  use-snapshot:
    description: Try to download and restore db-snapshot
    required: false
    default: 'true'
  snapshot-artifact:
    description: Artifact name produced by db-snapshot
    required: false
    default: 'db-snapshot'
  snapshot-path:
    description: Path to the gzip snapshot after download
    required: false
    default: '/tmp/db-snapshot/cobol-snapshot.sql.gz'
  grants:
    description: Provision the least-privilege app account
    required: false
    default: 'true'
  seed:
    description: Load database/seed_test_data.sql
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Download DB snapshot
      if: ${{ inputs.use-snapshot == 'true' }}
      id: download
      continue-on-error: true
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
      with:
        name: ${{ inputs.snapshot-artifact }}
        path: /tmp/db-snapshot
    - name: Restore snapshot or rebuild schema
      shell: bash
      run: |
        set -euo pipefail
        if [ "${{ inputs.use-snapshot }}" = "true" ] \
            && [ "${{ steps.download.outcome }}" = "success" ] \
            && [ -f "${{ inputs.snapshot-path }}" ]; then
          bash scripts/ci/restore_db_snapshot.sh "${{ inputs.snapshot-path }}"
        else
          echo "snapshot unavailable; falling back to schema + migrations"
          mysql -h "$DB_HOST" -P "$DB_PORT" -u "$DB_MIGRATE_USER" \
            -p"$DB_MIGRATE_PASS" "$DB_NAME" < database/schema.sql
          ./database/migrate.sh
        fi
    - name: Provision least-privilege app account
      if: ${{ inputs.grants == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        APP_DB_PASS="$DB_PASS" MIGRATE_USER="$DB_MIGRATE_USER" \
          MIGRATE_DB_PASS="$DB_MIGRATE_PASS" DB_ADMIN_USER="$DB_MIGRATE_USER" \
          DB_ADMIN_PASS="$DB_MIGRATE_PASS" DB_HOST="$DB_HOST" DB_PORT="$DB_PORT" \
          DB_NAME="$DB_NAME" database/grants.sh
    - name: Seed test data
      if: ${{ inputs.seed == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        mysql -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USER" -p"$DB_PASS" "$DB_NAME" \
          < database/seed_test_data.sql
