name: Setup GnuCOBOL
description: Install and expose the pinned GnuCOBOL toolchain used by coverage jobs.
inputs:
  version:
    description: GnuCOBOL version
    required: false
    default: '3.2'
  cache-suffix:
    description: Bump when configure flags change
    required: false
    default: 'v1'
runs:
  using: composite
  steps:
    - name: Restore GnuCOBOL toolchain
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ~/.local/gnucobol
        key: gnucobol-${{ inputs.version }}-${{ runner.os }}-${{ inputs.cache-suffix }}
        # Bump cache-suffix when scripts/ci/install_gnucobol.sh changes
        # its configure flags (a different build must not reuse this cache).
    - name: Install GnuCOBOL
      shell: bash
      run: |
        set -euo pipefail
        bash scripts/ci/install_gnucobol.sh "${{ inputs.version }}"
    - name: Expose GnuCOBOL toolchain
      shell: bash
      run: |
        set -euo pipefail
        echo "$HOME/.local/gnucobol/bin" >> "$GITHUB_PATH"
        echo "LD_LIBRARY_PATH=$HOME/.local/gnucobol/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
