name: Coverage

on:
  schedule:
    # Nightly at 02:30 UTC.
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: cobol_db
          MARIADB_USER: cobol_user
          MARIADB_PASSWORD: cobol_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: cobol_db
      DB_USER: cobol_user
      DB_PASS: cobol_pass
      DB_MIGRATE_USER: root
      DB_MIGRATE_PASS: root
      SKIP_BUILD: '1'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgmp-dev libmysqlclient-dev build-essential mariadb-client

      - name: Restore GnuCOBOL toolchain
        id: gnucobol-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/gnucobol
          # Bump the trailing v1 when scripts/ci/install_gnucobol.sh changes
          # its configure flags (a different build must not reuse this cache).
          key: gnucobol-3.2-${{ runner.os }}-v1

      - name: Install GnuCOBOL 3.2 (with --coverage)
        # Idempotent: exits in seconds when the cache hit. The apt gnucobol
        # (3.1.2) cannot do --coverage, so the coverage jobs must not use it.
        run: bash scripts/ci/install_gnucobol.sh

      - name: Expose GnuCOBOL toolchain
        run: |
          echo "$HOME/.local/gnucobol/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$HOME/.local/gnucobol/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: middleware/package-lock.json

      - name: Install gateway dependencies
        run: npm ci --prefix middleware

      - name: Build normal binary
        run: ./build.sh

      - name: Load baseline schema
        run: >
          mysql -h "$DB_HOST" -P "$DB_PORT"
          -u "$DB_MIGRATE_USER" -p"$DB_MIGRATE_PASS" "$DB_NAME"
          < database/schema.sql

      - name: Apply migrations
        run: ./database/migrate.sh

      - name: Seed test data
        run: >
          mysql -h "$DB_HOST" -P "$DB_PORT"
          -u "$DB_USER" -p"$DB_PASS" "$DB_NAME"
          < database/seed_test_data.sql

      - name: Run coverage gate
        run: bash scripts/ci/coverage.sh --json

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: coverage
          overwrite: true
          path: coverage/
          if-no-files-found: ignore
