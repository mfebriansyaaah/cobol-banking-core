name: Coverage

on:
  schedule:
    # Nightly at 02:30 UTC, after the 02:00 full-fleet run.
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: cobol_db
          MARIADB_USER: cobol_user
          MARIADB_PASSWORD: cobol_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: cobol_db
      DB_USER: cobol_user
      DB_PASS: cobol_pass
      DB_MIGRATE_USER: root
      DB_MIGRATE_PASS: root
      SKIP_BUILD: '1'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # The instrumented link reuses normal objects. Without this cache the
      # nightly measurement recompiles every module from scratch.
      - name: Restore COBOL build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: cobol/build
          key: >
            cobol-build-${{ runner.os }}-gnucobol3.2-${{
            hashFiles('cobol/src/**', 'cobol/copy/**', 'cobol/c_lib/**',
            'build.sh', 'cobol/Makefile', 'scripts/ci/install_gnucobol.sh') }}
          restore-keys: |
            cobol-build-${{ runner.os }}-gnucobol3.2-

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo timeout 240 apt-get install -y --no-install-recommends \
            libgmp-dev libmariadb-dev libmariadb-dev-compat build-essential mariadb-client || {
            sudo timeout 120 apt-get update
            sudo timeout 240 apt-get install -y --no-install-recommends \
              libgmp-dev libmariadb-dev libmariadb-dev-compat build-essential mariadb-client
          }

      - name: Setup GnuCOBOL
        uses: ./.github/actions/setup-cobol

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: middleware/package-lock.json

      - name: Install gateway dependencies
        run: npm ci --prefix middleware

      # coverage.sh runs ./build.sh itself before the instrumented link, so a
      # separate build step here would only duplicate work.
      - name: Bootstrap database
        uses: ./.github/actions/db-bootstrap
        with:
          use-snapshot: 'false'
          seed: 'true'

      - name: Run coverage gate
        run: bash scripts/ci/coverage.sh --json

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage
          overwrite: true
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

  notify:
    name: notify
    needs: [coverage]
    if: always() && needs.coverage.result != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Open or close CI failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          WORKFLOW_NAME: ${{ github.workflow }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          FAILED_JOBS: ${{ toJSON(needs) }}
        run: bash scripts/ci/notify_failure.sh "${{ needs.coverage.result }}"
