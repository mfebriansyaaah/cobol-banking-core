name: Coverage

on:
  schedule:
    # Nightly at 02:30 UTC.
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: cobol_db
          MARIADB_USER: cobol_user
          MARIADB_PASSWORD: cobol_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: cobol_db
      DB_USER: cobol_user
      DB_PASS: cobol_pass
      DB_MIGRATE_USER: root
      DB_MIGRATE_PASS: root
      SKIP_BUILD: '1'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgmp-dev libmysqlclient-dev build-essential mariadb-client

      - name: Setup GnuCOBOL
        uses: ./.github/actions/setup-cobol

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: middleware/package-lock.json

      - name: Install gateway dependencies
        run: npm ci --prefix middleware

      - name: Build normal binary
        run: ./build.sh

      - name: Bootstrap database
        uses: ./.github/actions/db-bootstrap
        with:
          use-snapshot: 'false'
          seed: 'true'

      - name: Run coverage gate
        run: bash scripts/ci/coverage.sh --json

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage
          overwrite: true
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore
