name: CI

# PRs are classified by the `changes` job instead of workflow-level path
# filters: the required checks must still report (skipped counts as success),
# which a fully skipped workflow cannot do. Push-to-main docs-only commits are
# filtered here because no PR gate is involved.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.git-blame-ignore-revs'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - '.github/CODEOWNERS'
  pull_request:
  workflow_dispatch:

# Least privilege: every job gets a read-only token unless it declares more.
permissions:
  contents: read

# A new commit on the same branch/PR cancels the previous run. This is the
# single largest wall-clock saving on active branches.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Single source of truth for the DB fleet size: the db-shards matrix, the
# shard runner, and the aggregate step all read this. 82 DB suites today.
env:
  DB_SHARD_COUNT: 2

jobs:
  # Changed-file classifier. Runs first and cheaply; every heavy job gates on
  # its outputs so docs-only PRs cost one small job instead of a full fleet.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      docker_relevant: ${{ steps.classify.outputs.docker_relevant }}
      coverage_relevant: ${{ steps.classify.outputs.coverage_relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HAS_CI_FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: bash scripts/ci/classify_changes.sh

  # All static analysis and fast tests live in one job. They are independent
  # of the compiled artifact, so running them here lets `build` stay a pure
  # compile/produce job and avoids installing the lint toolchain twice.
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # PR-size and docs gates need the merge-base, not a shallow tip.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      # Python 3.12 for the pip-installed lint tools: the runner default
      # (3.14) cannot import semgrep's opentelemetry/protobuf chain.
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      # Checksum-verified tool downloads; the cache makes lint survive a
      # release-CDN outage once any green run populated it.
      - name: Restore lint-tools cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/lint-tools
          key: lint-tools-${{ runner.os }}-${{ hashFiles('scripts/ci/install-tools.sh') }}
      - name: Install lint tools
        run: |
          mkdir -p "$HOME/.local/bin"
          bash scripts/ci/install-tools.sh --dest "$HOME/.local/bin" --cache-dir "$HOME/.cache/lint-tools"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          pip install --break-system-packages "setuptools==78.1.1" "yamllint==1.38.0" "semgrep==1.136.0"

      - name: Install JS lint tools
        run: npm ci

      - name: Install C lint tool
        # No unconditional `apt-get update`: on hosted runners the package
        # lists are already current, and a slow mirror here used to add
        # 3-8 minutes to the whole pipeline. Update only as a fallback, with
        # hard timeouts so a dead mirror cannot hang the job.
        run: |
          set -euo pipefail
          sudo timeout 180 apt-get install -y --no-install-recommends cppcheck || {
            sudo timeout 120 apt-get update
            sudo timeout 180 apt-get install -y --no-install-recommends cppcheck
          }

      - name: Shell lint
        run: bash scripts/ci/lint.sh

      - name: Strict C and cppcheck
        run: bash scripts/ci/c_strict.sh

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: Markdown lint
        run: npm run lint:md

      - name: Workflow lint
        run: actionlint

      - name: CI contract
        run: node scripts/check_ci_contract.mjs .

      - name: CI docs check
        run: node scripts/ci/check_ci_docs.mjs .

      - name: YAML lint
        run: bash scripts/ci/yaml_lint.sh

      - name: Validate alert rules
        run: promtool check rules monitoring/prometheus-alerts.yml

      # Semgrep stays: it is the only rule-based SAST over JS/scripts.
      # The old custom `sast.sh`/`sast_extra.sh` steps duplicated this,
      # gitleaks, and the static gate scripts, so they are no longer in CI.
      - name: Semgrep scan
        run: >
          semgrep --config .semgrep/rules.yml --exclude node_modules
          --exclude package-lock.json --error middleware scripts

      - name: Secret scan
        run: gitleaks detect --source . --no-git --redact --config .gitleaks.toml

      # The complete static gate fleet lives here: JS syntax + the 38
      # parallel tree gates. `test` sets SKIP_STATIC_GATES=1 so none of them
      # run twice. check_docs (README/stat table) is not part of run_gates.
      - name: Static gate fleet
        run: tests/run_all.sh gates

      - name: Docs stats
        run: node scripts/check_docs.mjs .

      # Gate-detection probes mutate a throwaway copy and require the gates
      # to notice; ~38s, no DB and no real build.
      - name: Gate detection probes
        run: tests/probes/run_probes.sh

      - name: PR-size report (non-gating)
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          [ -n "$BASE" ] || BASE="origin/main"
          node scripts/pr_size.mjs --base "$BASE" --head HEAD | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Gate unit tests
        # Capture the log and re-exit with the test status: piping through
        # `tail` would otherwise mask a red gate with tail's exit code.
        run: >
          mkdir -p test-results/gate &&
          node --test --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=junit --test-reporter-destination=test-results/gate/junit.xml
          "scripts/test/*.test.mjs" >test-results/gate/unit.log 2>&1; rc=$?;
          tail -5 test-results/gate/unit.log; exit $rc

      - name: Offline safety harness (no DB, no build)
        run: bash tests/scripts/run.sh

      - name: Coverage mapper unit tests
        run: python3 scripts/coverage/test_map_cobol.py

      - name: Mutation anchor guard
        run: bash tests/probes/money_path_mutants.sh --check-anchors

      - name: Upload gate test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: gate-tests-junit
          overwrite: true
          path: test-results/gate/junit.xml
          retention-days: 7
          if-no-files-found: warn

      - name: Dependency audit (root)
        run: npm audit --omit=dev

      - name: Dependency audit (gateway)
        run: npm --prefix middleware audit --omit=dev

      - name: Upload failure diagnostics
        if: failure()
        uses: ./.github/actions/upload-diagnostics
        with:
          name: diagnostics-lint

  # Pure producer job: compile once, cache objects, publish the binary that
  # every DB/gateway consumer downloads. No Node, no static gates, no apt
  # update on the critical path.
  build:
    name: build
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Key pins the toolchain and every build input; objects must never
      # cross compiler versions.
      - name: Restore COBOL build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: cobol/build
          key: >
            cobol-build-${{ runner.os }}-gnucobol3.2-${{
            hashFiles('cobol/src/**', 'cobol/copy/**', 'cobol/c_lib/**',
            'build.sh', 'cobol/Makefile', 'scripts/ci/install_gnucobol.sh') }}
          restore-keys: |
            cobol-build-${{ runner.os }}-gnucobol3.2-

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo timeout 180 apt-get install -y --no-install-recommends \
            libgmp-dev libmariadb-dev libmariadb-dev-compat build-essential || {
            sudo timeout 120 apt-get update
            sudo timeout 180 apt-get install -y --no-install-recommends \
              libgmp-dev libmariadb-dev libmariadb-dev-compat build-essential
          }

      - name: Setup GnuCOBOL
        uses: ./.github/actions/setup-cobol

      - name: Build core
        run: |
          set -o pipefail
          ./build.sh 2>&1 | tee build.log

      - name: Check core warning ratchet
        run: scripts/check_warnings.sh build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: build-log
          overwrite: true
          path: build.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: cobol-binary
          overwrite: true
          path: cobol/bin/main_logic
          retention-days: 1
          if-no-files-found: error

      - name: Upload failure diagnostics
        if: failure()
        uses: ./.github/actions/upload-diagnostics
        with:
          name: diagnostics-build

  # Packaging validation. It does not consume the build artifact, so it runs
  # in parallel with `build` instead of waiting for it. On PRs it is limited
  # to changes that can alter the image; push-to-main always validates.
  docker-build:
    name: docker-build
    needs: changes
    if: >
      needs.changes.outputs.docs_only != 'true' &&
      (github.event_name != 'pull_request' ||
       needs.changes.outputs.docker_relevant == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build production image
        run: docker build -f Dockerfile -t cobol-banking-core:ci .

      - name: Verify native linkage
        run: |
          docker run --rm cobol-banking-core:ci ldd /app/cobol/bin/main_logic
          if docker run --rm cobol-banking-core:ci ldd /app/cobol/bin/main_logic | grep -q "not found"; then
            echo "missing native libraries in production image" >&2
            exit 1
          fi

  # One migration run produces both the DB data snapshot and the normalized
  # schema snapshot. It does not need the binary, so it starts immediately
  # instead of queueing behind `build`.
  db-snapshot:
    name: db-snapshot
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: cobol_db
          MARIADB_USER: cobol_user
          MARIADB_PASSWORD: cobol_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: cobol_db
      DB_MIGRATE_USER: root
      DB_MIGRATE_PASS: root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install runtime dependencies
        run: |
          set -euo pipefail
          sudo timeout 180 apt-get install -y --no-install-recommends mariadb-client || {
            sudo timeout 120 apt-get update
            sudo timeout 180 apt-get install -y --no-install-recommends mariadb-client
          }

      # The service creates cobol_db with the server default collation. The
      # committed snapshot was generated in a database explicitly created with
      # utf8mb4_unicode_ci, so align the default before schema.sql runs; tables
      # that inherit the database collation must not drift on collation alone.
      - name: Align database collation with snapshot baseline
        run: >
          mysql -h "$DB_HOST" -P "$DB_PORT"
          -u "$DB_MIGRATE_USER" -p"$DB_MIGRATE_PASS"
          -e "ALTER DATABASE \`$DB_NAME\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"

      - name: Load baseline schema
        run: >
          mysql --default-character-set=utf8mb4
          -h "$DB_HOST" -P "$DB_PORT"
          -u "$DB_MIGRATE_USER" -p"$DB_MIGRATE_PASS" "$DB_NAME"
          < database/schema.sql

      - name: Apply migrations
        run: ./database/migrate.sh

      - name: Verify migration ledger
        run: ./database/migrate.sh --check

      - name: Build DB snapshot
        run: bash scripts/ci/build_db_snapshot.sh /tmp/cobol-snapshot.sql.gz

      - name: Build normalized schema snapshot
        run: bash scripts/generate_schema_snapshot.sh --from-db "$DB_NAME" --out /tmp/schema-fresh.sql

      - name: Upload DB snapshot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: db-snapshot
          overwrite: true
          path: /tmp/cobol-snapshot.sql.gz
          retention-days: 1
          if-no-files-found: error

      - name: Upload schema snapshot for drift check
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: schema-fresh
          overwrite: true
          path: /tmp/schema-fresh.sql
          retention-days: 1
          if-no-files-found: error

  # Compares the producer's normalized schema snapshot with the committed
  # baselines. It needs the producer artifact but is not a dependency of
  # test/db-shards/coverage-pr: a drift failure blocks merge via the required
  # `db aggregate` job without withholding the DB data snapshot. Push runs are
  # skipped because the PR gate and nightly already cover drift.
  schema-drift:
    name: schema-drift
    needs: [db-snapshot, changes]
    if: >
      (github.event_name == 'pull_request' && needs.changes.outputs.docs_only != 'true') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download normalized schema snapshot
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: schema-fresh
          path: /tmp/schema-fresh

      - name: Schema snapshot hash (PR-065 artifact policy)
        run: sha256sum database/schema_full.sql | tee /tmp/schema-full.sha256

      - name: Schema drift check (PR-065)
        run: bash scripts/check_schema_drift.sh --from /tmp/schema-fresh/schema-fresh.sql

      - name: Upload schema hash
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: schema-hash
          overwrite: true
          path: /tmp/schema-full.sha256
          retention-days: 7
          if-no-files-found: error

  # PR-only non-DB gate: static tests already ran in `lint`, the DB fleet runs
  # in the shard matrix. Integration/gateway/error harness run here.
  test:
    name: test
    needs: [build, db-snapshot, changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: cobol_db
          MARIADB_USER: cobol_user
          MARIADB_PASSWORD: cobol_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      # Email OTP flow (tests/integration/email_otp_flow.sh).
      mailpit:
        image: axllent/mailpit@sha256:23a2ef85bc50853ab3093645d1d64679afd8887e89da5e48a88940c172591a4e
        ports:
          - 1025:1025
          - 8025:8025
    env:
      QUARANTINE: '1'
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: cobol_db
      DB_USER: cobol_user
      DB_PASS: cobol_pass
      DB_MIGRATE_USER: root
      DB_MIGRATE_PASS: root
      SKIP_BUILD: '1'
      SKIP_STATIC_GATES: '1'
      REQUIRE_MAILPIT: '1'
      ISOLATED_DB: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Runtime only: the binary is built in `build`, so no compiler headers
      # or build-essential are needed here.
      - name: Install runtime dependencies
        run: |
          set -euo pipefail
          sudo timeout 180 apt-get install -y --no-install-recommends \
            libgmp-dev libmariadb3 mariadb-client || {
            sudo timeout 120 apt-get update
            sudo timeout 180 apt-get install -y --no-install-recommends \
              libgmp-dev libmariadb3 mariadb-client
          }

      - name: Setup GnuCOBOL
        uses: ./.github/actions/setup-cobol

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: middleware/package-lock.json

      - name: Install gateway dependencies
        run: npm ci --prefix middleware

      - name: Download core binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: cobol-binary
          path: cobol/bin

      - name: Make binary executable
        run: chmod +x cobol/bin/main_logic

      - name: Bootstrap database
        uses: ./.github/actions/db-bootstrap

      - name: Run full test gate (DB via matrix)
        env:
          SKIP_DB: '1'
        run: tests/run_all.sh full

      - name: Write test summary
        if: always()
        run: node scripts/ci/summary.mjs --report-dir artifacts/latest

      - name: Gateway residue check
        if: always()
        run: |
          set -o pipefail
          if [ -z "${TEST_RUN_ID:-}" ]; then
            echo "no TEST_RUN_ID (gateway smoke did not run?); skipping residue check"
            exit 0
          fi
          TEST_RUN_ID="$TEST_RUN_ID" bash scripts/check_test_residue.sh | tee /tmp/gateway_residue.log

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: test-reports
          overwrite: true
          path: artifacts/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload gateway log on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: gateway-log
          overwrite: true
          path: /tmp/gateway_endpoints.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload residue log on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: gateway-residue-log
          overwrite: true
          path: /tmp/gateway_residue.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload failure diagnostics
        if: failure()
        uses: ./.github/actions/upload-diagnostics
        with:
          name: diagnostics-test

  # The DB fleet is the only PR gate that needs multiple runners. Two LPT
  # shards keep wall-clock near the p95 SLO without doubling runner cost.
  db-shards:
    name: db shard ${{ matrix.shard }}
    needs: [build, db-snapshot, changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: cobol_db
          MARIADB_USER: cobol_user
          MARIADB_PASSWORD: cobol_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: cobol_db
      DB_USER: cobol_user
      DB_PASS: cobol_pass
      DB_MIGRATE_USER: root
      DB_MIGRATE_PASS: root
      SKIP_BUILD: '1'
      ISOLATED_DB: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install runtime dependencies
        run: |
          set -euo pipefail
          sudo timeout 180 apt-get install -y --no-install-recommends \
            libgmp-dev libmariadb3 mariadb-client || {
            sudo timeout 120 apt-get update
            sudo timeout 180 apt-get install -y --no-install-recommends \
              libgmp-dev libmariadb3 mariadb-client
          }

      - name: Setup GnuCOBOL
        uses: ./.github/actions/setup-cobol

      # Node is used by the shard planner; no npm packages are needed here.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'

      - name: Download core binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: cobol-binary
          path: cobol/bin

      - name: Make binary executable
        run: chmod +x cobol/bin/main_logic

      - name: Bootstrap database
        uses: ./.github/actions/db-bootstrap

      - name: Run DB shard
        run: DB_SHARD_INDEX=${{ matrix.shard }} tests/run_all.sh db-shard

      - name: Write shard summary
        if: always()
        run: node scripts/ci/summary.mjs --report-dir artifacts/latest

      - name: Upload shard reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: shard-reports-${{ matrix.shard }}
          overwrite: true
          path: artifacts/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload failure diagnostics
        if: failure()
        uses: ./.github/actions/upload-diagnostics
        with:
          name: diagnostics-db-shard-${{ matrix.shard }}

  db-aggregate:
    name: db aggregate
    needs: [test, db-shards, schema-drift, changes]
    if: always() && github.event_name == 'pull_request' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
      pull-requests: read
    env:
      QUARANTINE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Fail when schema drift failed
        if: always() && needs.schema-drift.result == 'failure'
        run: |
          echo "schema-drift failed: regenerate database/schema_full.sql (see that job)" >&2
          exit 1

      - name: Check upstream results
        id: upstream
        if: always()
        run: |
          set -euo pipefail
          if [ "${{ needs.test.result }}" = "success" ] \
              && [ "${{ needs.db-shards.result }}" = "success" ] \
              && [ "${{ needs.changes.result }}" = "success" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::error::cannot aggregate: test=${{ needs.test.result }} \
              db-shards=${{ needs.db-shards.result }} \
              changes=${{ needs.changes.result }}"
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'

      - name: Download all reports
        if: always() && steps.upstream.outputs.ok == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: "*-reports*"
          path: parts/

      - name: Merge and verify shard reports
        if: always() && steps.upstream.outputs.ok == 'true'
        run: bash scripts/ci/aggregate_shard_reports.sh parts merged "$DB_SHARD_COUNT"

      - name: Assertion count gate
        if: always() && steps.upstream.outputs.ok == 'true' && needs.test.result == 'success'
        run: node scripts/check_test_counts.mjs --report-dir merged --strict

      - name: Note skipped count gate
        if: always() && needs.test.result != 'success'
        run: >
          echo "test job did not succeed (result: ${{ needs.test.result }});
          skipping the assertion-count gate — see the test job for the
          real failure"

      - name: Write test summary
        if: always() && steps.upstream.outputs.ok == 'true'
        run: node scripts/ci/summary.mjs --report-dir merged

      - name: Upload merged reports
        if: always() && steps.upstream.outputs.ok == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: test-reports-merged
          overwrite: true
          path: merged/
          retention-days: 14
          if-no-files-found: warn

      - name: Publish test annotations
        if: >-
          always() && steps.upstream.outputs.ok == 'true' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: dorny/test-reporter@df6247429542221bc30d46a036ee47af1102c451  # v2
        with:
          name: DB + gateway tests
          path: merged/junit/**/*.xml
          reporter: java-junit
          fail-on-error: false

  # Manual smoke gate. Kept as a required context only because branch
  # protection still lists it; it intentionally does not run on PRs. Removing
  # it from the protection rules is the cleaner long-term fix.
  coverage:
    name: coverage
    if: github.event_name == 'workflow_dispatch'
    needs: [build, db-snapshot]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: cobol_db
          MARIADB_USER: cobol_user
          MARIADB_PASSWORD: cobol_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: cobol_db
      DB_USER: cobol_user
      DB_PASS: cobol_pass
      DB_MIGRATE_USER: root
      DB_MIGRATE_PASS: root
      SKIP_BUILD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install runtime dependencies
        run: |
          set -euo pipefail
          sudo timeout 180 apt-get install -y --no-install-recommends \
            libgmp-dev libmariadb-dev libmariadb-dev-compat build-essential mariadb-client || {
            sudo timeout 120 apt-get update
            sudo timeout 180 apt-get install -y --no-install-recommends \
              libgmp-dev libmariadb-dev libmariadb-dev-compat build-essential mariadb-client
          }

      - name: Setup GnuCOBOL
        uses: ./.github/actions/setup-cobol

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: middleware/package-lock.json

      - name: Install gateway dependencies
        run: npm ci --prefix middleware

      - name: Download core binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: cobol-binary
          path: cobol/bin

      - name: Make binary executable
        run: chmod +x cobol/bin/main_logic

      - name: Bootstrap database
        uses: ./.github/actions/db-bootstrap
        with:
          seed: 'true'

      - name: Gateway coverage
        run: bash scripts/ci/coverage.sh --gateway-only

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage
          overwrite: true
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload failure diagnostics
        if: failure()
        uses: ./.github/actions/upload-diagnostics
        with:
          name: diagnostics-coverage

  # Post-merge operational drills. They do not need a compiled binary, but the
  # contract keeps `build` as a dependency; it is cheap now.
  db-ops:
    name: db-ops
    needs: [build, db-snapshot, changes]
    if: github.event_name != 'pull_request' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: cobol_db
          MARIADB_USER: cobol_user
          MARIADB_PASSWORD: cobol_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: cobol_db
      DB_USER: cobol_user
      DB_PASS: cobol_pass
      DB_MIGRATE_USER: root
      DB_MIGRATE_PASS: root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install runtime dependencies
        run: |
          set -euo pipefail
          sudo timeout 180 apt-get install -y --no-install-recommends mariadb-client || {
            sudo timeout 120 apt-get update
            sudo timeout 180 apt-get install -y --no-install-recommends mariadb-client
          }

      - name: Bootstrap database
        uses: ./.github/actions/db-bootstrap
        with:
          grants: 'false'

      - name: Migration rollback drill
        run: bash scripts/ci/migration_rollback_drill.sh

      - name: Backup and restore drill
        run: bash scripts/ci/backup_restore_drill.sh

      - name: Upload failure diagnostics
        if: failure()
        uses: ./.github/actions/upload-diagnostics
        with:
          name: diagnostics-db-ops

  # Curated COBOL coverage is impact-selected. It compiles its own
  # instrumented binary, so it does not wait for `build`.
  coverage-pr:
    name: coverage-pr
    if: >
      github.event_name == 'pull_request' &&
      needs.changes.outputs.docs_only != 'true' &&
      needs.changes.outputs.coverage_relevant == 'true'
    needs: [db-snapshot, changes]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: cobol_db
          MARIADB_USER: cobol_user
          MARIADB_PASSWORD: cobol_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: cobol_db
      DB_USER: cobol_user
      DB_PASS: cobol_pass
      DB_MIGRATE_USER: root
      DB_MIGRATE_PASS: root
      SKIP_BUILD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # --changed diffs against origin/main; a shallow checkout has no base.
          fetch-depth: 0

      # Objects are toolchain-specific; the key pins GnuCOBOL 3.2 and every
      # build input. Warm runs only recompile changed modules.
      - name: Restore COBOL build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: cobol/build
          key: >
            cobol-build-${{ runner.os }}-gnucobol3.2-${{
            hashFiles('cobol/src/**', 'cobol/copy/**', 'cobol/c_lib/**',
            'build.sh', 'cobol/Makefile', 'scripts/ci/install_gnucobol.sh') }}
          restore-keys: |
            cobol-build-${{ runner.os }}-gnucobol3.2-

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo timeout 180 apt-get install -y --no-install-recommends \
            libgmp-dev libmariadb-dev libmariadb-dev-compat build-essential mariadb-client || {
            sudo timeout 120 apt-get update
            sudo timeout 180 apt-get install -y --no-install-recommends \
              libgmp-dev libmariadb-dev libmariadb-dev-compat build-essential mariadb-client
          }

      - name: Setup GnuCOBOL
        uses: ./.github/actions/setup-cobol

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: middleware/package-lock.json

      - name: Install gateway dependencies
        run: npm ci --prefix middleware

      - name: Bootstrap database
        uses: ./.github/actions/db-bootstrap
        with:
          seed: 'true'

      - name: Curated COBOL coverage (impact-selected)
        run: bash scripts/ci/coverage.sh --cobol-only --changed origin/main --json

      - name: Coverage summary
        if: always()
        run: node scripts/ci/coverage_summary.mjs

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage-pr
          overwrite: true
          path: coverage/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload failure diagnostics
        if: failure()
        uses: ./.github/actions/upload-diagnostics
        with:
          name: diagnostics-coverage-pr

  # Push-to-main notification only; never a required check.
  notify:
    name: notify
    needs: [lint, changes, build, docker-build, db-snapshot, schema-drift, test, db-shards,
            db-aggregate, coverage, coverage-pr, db-ops]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Open CI failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          WORKFLOW_NAME: ${{ github.workflow }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          FAILED_JOBS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          if [ "${{ contains(join(needs.*.result, ','), 'failure') }}" = "true" ]; then
            bash scripts/ci/notify_failure.sh failure
          else
            bash scripts/ci/notify_failure.sh success
          fi
