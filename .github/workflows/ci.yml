name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gnucobol libmysqlclient-dev build-essential

      - name: Verify manifest
        run: node scripts/check_manifest.mjs .

      - name: Verify documentation
        run: node scripts/check_docs.mjs .

      - name: Gate detection probes
        run: tests/probes/run_probes.sh

      - name: SAST scan
        run: bash scripts/ci/sast.sh

      - name: Build core
        run: |
          set -o pipefail
          ./build.sh 2>&1 | tee build.log

      - name: Check core warning ratchet
        run: scripts/check_warnings.sh build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: cobol-binary
          path: cobol/bin/main_logic
          if-no-files-found: error

  test:
    name: test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: cobol_db
          MARIADB_USER: cobol_user
          MARIADB_PASSWORD: cobol_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: cobol_db
      DB_USER: cobol_user
      DB_PASS: cobol_pass
      DB_MIGRATE_USER: root
      DB_MIGRATE_PASS: root
      SKIP_BUILD: '1'
      # The service database is already provisioned (schema + migrations) by
      # the steps below, so run_all.sh db uses it directly instead of
      # building a second isolated copy (Fase 4.2). Fuzz runs inside
      # run_all.sh full; no separate step needed (Fase 4.1).
      ISOLATED_DB: '0'
      DB_SHARDS: '4'

    steps:
      - uses: actions/checkout@v4

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gnucobol libmysqlclient-dev build-essential mariadb-client

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: middleware/package-lock.json

      - name: Install gateway dependencies
        run: npm ci --prefix middleware

      - name: Download core binary
        uses: actions/download-artifact@v4
        with:
          name: cobol-binary
          path: cobol/bin

      - name: Make binary executable
        run: chmod +x cobol/bin/main_logic

      - name: Provision least-privilege app account
        run: >
          APP_DB_PASS="$DB_PASS" MIGRATE_USER="$DB_MIGRATE_USER"
          MIGRATE_DB_PASS="$DB_MIGRATE_PASS" DB_ADMIN_USER="$DB_MIGRATE_USER"
          DB_ADMIN_PASS="$DB_MIGRATE_PASS" DB_HOST="$DB_HOST" DB_PORT="$DB_PORT"
          DB_NAME="$DB_NAME" database/grants.sh

      - name: Load baseline schema
        run: >
          mysql -h "$DB_HOST" -P "$DB_PORT"
          -u "$DB_MIGRATE_USER" -p"$DB_MIGRATE_PASS" "$DB_NAME"
          < database/schema.sql

      - name: Apply migrations
        run: ./database/migrate.sh

      - name: Run full test gate
        run: tests/run_all.sh full

      - name: Assertion count gate
        run: node scripts/check_test_counts.mjs --report-dir artifacts --strict

      - name: Migration apply + idempotency drill
        run: bash scripts/ci/migration_rollback_drill.sh

      - name: Schema rebuild drill
        run: bash scripts/ci/restore_drill.sh

      - name: Performance benchmarks
        run: bash tests/perf/bench.sh

      - name: Write test summary
        if: always()
        run: node scripts/ci/summary.mjs

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: artifacts/
          if-no-files-found: warn

      - name: Upload gateway log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-log
          path: /tmp/gateway_endpoints.log
          if-no-files-found: ignore

  coverage:
    name: coverage
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: cobol_db
          MARIADB_USER: cobol_user
          MARIADB_PASSWORD: cobol_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: cobol_db
      DB_USER: cobol_user
      DB_PASS: cobol_pass
      DB_MIGRATE_USER: root
      DB_MIGRATE_PASS: root
      SKIP_BUILD: '1'

    steps:
      - uses: actions/checkout@v4

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gnucobol libmysqlclient-dev build-essential mariadb-client

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: middleware/package-lock.json

      - name: Install gateway dependencies
        run: npm ci --prefix middleware

      - name: Download core binary
        uses: actions/download-artifact@v4
        with:
          name: cobol-binary
          path: cobol/bin

      - name: Make binary executable
        run: chmod +x cobol/bin/main_logic

      - name: Load baseline schema
        run: >
          mysql -h "$DB_HOST" -P "$DB_PORT"
          -u "$DB_MIGRATE_USER" -p"$DB_MIGRATE_PASS" "$DB_NAME"
          < database/schema.sql

      - name: Apply migrations
        run: ./database/migrate.sh

      - name: Seed test data
        run: >
          mysql -h "$DB_HOST" -P "$DB_PORT"
          -u "$DB_USER" -p"$DB_PASS" "$DB_NAME"
          < database/seed_test_data.sql

      - name: Gateway coverage
        run: bash scripts/ci/coverage.sh --gateway-only

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  post-merge:
    name: post-merge
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, test]
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: cobol_db
          MARIADB_USER: cobol_user
          MARIADB_PASSWORD: cobol_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: cobol_db
      DB_USER: cobol_user
      DB_PASS: cobol_pass
      DB_MIGRATE_USER: root
      DB_MIGRATE_PASS: root
    steps:
      - uses: actions/checkout@v4
      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gnucobol libmysqlclient-dev build-essential mariadb-client
      - name: Load baseline schema
        run: >
          mysql -h "$DB_HOST" -P "$DB_PORT"
          -u "$DB_MIGRATE_USER" -p"$DB_MIGRATE_PASS" "$DB_NAME"
          < database/schema.sql
      - name: Apply migrations
        run: ./database/migrate.sh
      - name: Migration apply + idempotency drill
        run: bash scripts/ci/migration_rollback_drill.sh

      - name: Schema rebuild drill
        run: bash scripts/ci/restore_drill.sh
  coverage-pr:
    name: coverage-pr
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: cobol_db
          MARIADB_USER: cobol_user
          MARIADB_PASSWORD: cobol_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: cobol_db
      DB_USER: cobol_user
      DB_PASS: cobol_pass
      DB_MIGRATE_USER: root
      DB_MIGRATE_PASS: root
      SKIP_BUILD: '1'

    steps:
      - uses: actions/checkout@v4
        with:
          # --changed diffs against origin/main; a shallow checkout has no base.
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgmp-dev libmysqlclient-dev build-essential mariadb-client

      - name: Restore GnuCOBOL toolchain
        id: gnucobol-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/gnucobol
          # Bump the trailing v1 when scripts/ci/install_gnucobol.sh changes
          # its configure flags (a different build must not reuse this cache).
          key: gnucobol-3.2-${{ runner.os }}-v1

      - name: Install GnuCOBOL 3.2 (with --coverage)
        # Idempotent: exits in seconds when the cache hit. The apt gnucobol
        # (3.1.2) cannot do --coverage, so the coverage jobs must not use it.
        run: bash scripts/ci/install_gnucobol.sh

      - name: Expose GnuCOBOL toolchain
        run: |
          echo "$HOME/.local/gnucobol/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$HOME/.local/gnucobol/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: middleware/package-lock.json

      - name: Install gateway dependencies
        run: npm ci --prefix middleware

      - name: Load baseline schema
        run: >
          mysql -h "$DB_HOST" -P "$DB_PORT"
          -u "$DB_MIGRATE_USER" -p"$DB_MIGRATE_PASS" "$DB_NAME"
          < database/schema.sql

      - name: Apply migrations
        run: ./database/migrate.sh

      - name: Seed test data
        run: >
          mysql -h "$DB_HOST" -P "$DB_PORT"
          -u "$DB_USER" -p"$DB_PASS" "$DB_NAME"
          < database/seed_test_data.sql

      - name: Curated COBOL coverage (impact-selected)
        run: bash scripts/ci/coverage.sh --cobol-only --changed origin/main --json

      - name: Coverage summary
        if: always()
        run: |
          if [ ! -f coverage/summary.json ]; then
            echo "no coverage/summary.json (measurement skipped or failed early)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node -e '
            const fs = require("fs");
            const summary = JSON.parse(fs.readFileSync("coverage/summary.json", "utf8"));
            const base = {};
            for (const line of fs.readFileSync("tests/coverage_baseline.txt", "utf8").split("\n")) {
              const t = line.trim();
              if (!t || t.startsWith("#")) continue;
              const [k, v] = t.split(/\s+/);
              base[k] = Number(v);
            }
            const rows = JSON.parse(fs.readFileSync("coverage/cobol.json", "utf8")).modules;
            const modBase = new Map();
            for (const line of fs.readFileSync("tests/coverage_module_baseline.txt", "utf8").split("\n")) {
              const t = line.trim();
              if (!t || t.startsWith("#")) continue;
              const [m, v] = t.split(/\s+/);
              modBase.set(m, Number(v));
            }
            const dropped = rows
              .filter((r) => modBase.has(r.module) && r.percent < modBase.get(r.module) - 1.0)
              .sort((a, b) => (a.percent - modBase.get(a.module)) - (b.percent - modBase.get(b.module)));
            const d = (v, b) => `${v.toFixed(2)}% (baseline ${b.toFixed(2)}%, ${v - b >= 0 ? "+" : ""}${(v - b).toFixed(2)}pp)`;
            const out = ["## Coverage (curated COBOL + gateway)", "",
              "| Suite | Measured | Baseline |", "|---|---|---|",
              `| COBOL curated | ${summary.cobol.percent.toFixed(2)}% covered of ${summary.cobol.executable} lines | ${d(summary.cobol.percent, base.cobol_total)} / floor 30% |`,
              `| gateway lines | ${summary.gateway.lines.toFixed(2)}% | floor 80%, baseline ${base.gateway_lines}% |`,
              `| gateway branches | ${summary.gateway.branches.toFixed(2)}% | floor 70%, baseline ${base.gateway_branches}% |`, ""];
            if (dropped.length) {
              out.push("Modules below baseline (>1pp):");
              for (const r of dropped) out.push(`- ${r.module}: ${r.percent}% vs ${modBase.get(r.module)}%`);
              out.push("");
            } else {
              out.push("No curated module dropped below its baseline.", "");
            }
            out.push("Full report: see the `coverage-pr` artifact on this run.");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, out.join("\n") + "\n");
          '

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-pr
          path: coverage/
          if-no-files-found: warn
