name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: every job gets a read-only token unless it declares more
# (the CodeQL analyze job adds security-events: write for its own scope).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      # Pinned to the versions verified locally (see scripts/ci/lint.sh):
      # apt versions drift between runners and change findings.
      - name: Install lint tools
        run: |
          SC_VER=0.10.0
          SHFMT_VER=3.11.0
          ACTIONLINT_VER=1.7.7
          PROMTOOL_VER=3.3.1
          SC_BASE=https://github.com/koalaman/shellcheck/releases/download
          SHFMT_BASE=https://github.com/mvdan/sh/releases/download
          ACTIONLINT_BASE=https://github.com/rhysd/actionlint/releases/download
          ACTIONLINT_TGZ="actionlint_${ACTIONLINT_VER}_linux_amd64.tar.gz"
          PROM_BASE=https://github.com/prometheus/prometheus/releases/download
          GITLEAKS_VER=8.28.0
          GITLEAKS_BASE=https://github.com/gitleaks/gitleaks/releases/download
          mkdir -p "$HOME/.local/bin"
          curl -sL -o /tmp/sc.tar.xz "${SC_BASE}/v${SC_VER}/shellcheck-v${SC_VER}.linux.x86_64.tar.xz"
          tar -xf /tmp/sc.tar.xz -C /tmp
          cp "/tmp/shellcheck-v${SC_VER}/shellcheck" "$HOME/.local/bin/"
          curl -sL -o "$HOME/.local/bin/shfmt" "${SHFMT_BASE}/v${SHFMT_VER}/shfmt_v${SHFMT_VER}_linux_amd64"
          chmod +x "$HOME/.local/bin/shfmt"
          curl -sL -o /tmp/actionlint.tar.gz "${ACTIONLINT_BASE}/v${ACTIONLINT_VER}/${ACTIONLINT_TGZ}"
          tar -xzf /tmp/actionlint.tar.gz -C "$HOME/.local/bin" actionlint
          curl -sL -o /tmp/prom.tar.gz "${PROM_BASE}/v${PROMTOOL_VER}/prometheus-${PROMTOOL_VER}.linux-amd64.tar.gz"
          tar -xzf /tmp/prom.tar.gz -C /tmp "prometheus-${PROMTOOL_VER}.linux-amd64/promtool"
          cp "/tmp/prometheus-${PROMTOOL_VER}.linux-amd64/promtool" "$HOME/.local/bin/"
          curl -sL -o /tmp/gitleaks.tar.gz "${GITLEAKS_BASE}/v${GITLEAKS_VER}/gitleaks_${GITLEAKS_VER}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          pip install --break-system-packages "yamllint==1.38.0" "semgrep==1.136.0"

      - name: Install JS lint tools
        run: npm ci

      - name: Install C lint tool
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cppcheck

      - name: Shell lint
        run: bash scripts/ci/lint.sh

      - name: Strict C and cppcheck
        run: bash scripts/ci/c_strict.sh

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: Markdown lint
        run: npm run lint:md

      - name: Workflow lint
        run: actionlint

      - name: CI contract
        run: node scripts/check_ci_contract.mjs .

      - name: YAML lint
        run: bash scripts/ci/yaml_lint.sh

      - name: Validate alert rules
        run: promtool check rules monitoring/prometheus-alerts.yml

      - name: Semgrep scan
        run: >
          semgrep --config .semgrep/rules.yml --exclude node_modules
          --exclude package-lock.json --error middleware scripts

      - name: Secret scan
        run: gitleaks detect --source . --no-git --config .gitleaks.toml

      - name: Gate unit tests
        run: >
          mkdir -p test-results/gate &&
          node --test --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=junit --test-reporter-destination=test-results/gate/junit.xml
          "scripts/test/*.test.mjs" 2>&1 | tail -5

      - name: Offline safety harness (no DB, no build)
        run: bash tests/scripts/run.sh

      - name: Coverage mapper unit tests
        run: python3 scripts/coverage/test_map_cobol.py

      - name: Upload gate test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: gate-tests-junit
          path: test-results/gate/junit.xml
          if-no-files-found: warn

      - name: Dependency audit (root)
        run: npm audit --omit=dev

      - name: Dependency audit (gateway)
        run: npm --prefix middleware audit --omit=dev

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gnucobol libmysqlclient-dev build-essential

      - name: Verify manifest
        run: node scripts/check_manifest.mjs .

      - name: Verify documentation
        run: node scripts/check_docs.mjs .

      - name: Complexity audit snapshot (non-gating artifact)
        run: |
          mkdir -p artifacts
          node scripts/audit_complexity.mjs --json > artifacts/complexity.json

      - name: Upload complexity snapshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: complexity-snapshot
          path: artifacts/complexity.json
          if-no-files-found: ignore

      - name: Gate detection probes
        run: tests/probes/run_probes.sh

      - name: SAST scan
        run: bash scripts/ci/sast.sh

      - name: SAST extra scan
        run: bash scripts/ci/sast_extra.sh

      - name: Build core
        run: |
          set -o pipefail
          ./build.sh 2>&1 | tee build.log

      - name: Check core warning ratchet
        run: scripts/check_warnings.sh build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: cobol-binary
          path: cobol/bin/main_logic
          if-no-files-found: error

  test:
    name: test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: cobol_db
          MARIADB_USER: cobol_user
          MARIADB_PASSWORD: cobol_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: cobol_db
      DB_USER: cobol_user
      DB_PASS: cobol_pass
      DB_MIGRATE_USER: root
      DB_MIGRATE_PASS: root
      SKIP_BUILD: '1'
      # The service database is already provisioned (schema + migrations) by
      # the steps below, so run_all.sh db uses it directly instead of
      # building a second isolated copy (Fase 4.2). Fuzz runs inside
      # run_all.sh full; no separate step needed (Fase 4.1).
      ISOLATED_DB: '0'
      DB_SHARDS: '4'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gnucobol libmysqlclient-dev build-essential mariadb-client

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: middleware/package-lock.json

      - name: Install gateway dependencies
        run: npm ci --prefix middleware

      - name: Download core binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: cobol-binary
          path: cobol/bin

      - name: Make binary executable
        run: chmod +x cobol/bin/main_logic

      - name: Provision least-privilege app account
        run: >
          APP_DB_PASS="$DB_PASS" MIGRATE_USER="$DB_MIGRATE_USER"
          MIGRATE_DB_PASS="$DB_MIGRATE_PASS" DB_ADMIN_USER="$DB_MIGRATE_USER"
          DB_ADMIN_PASS="$DB_MIGRATE_PASS" DB_HOST="$DB_HOST" DB_PORT="$DB_PORT"
          DB_NAME="$DB_NAME" database/grants.sh

      - name: Load baseline schema
        run: >
          mysql -h "$DB_HOST" -P "$DB_PORT"
          -u "$DB_MIGRATE_USER" -p"$DB_MIGRATE_PASS" "$DB_NAME"
          < database/schema.sql

      - name: Apply migrations
        run: ./database/migrate.sh

      - name: Run full test gate (DB via matrix)
        env:
          # The DB fleet runs as one-job-per-shard in db-shards below (better
          # isolation: one database per runner). This keeps one invocation
          # (and its single report.tsv) coherent; local `full` still runs db.
          SKIP_DB: '1'
        run: tests/run_all.sh full

      - name: Gateway residue check
        if: always()
        run: |
          set -o pipefail
          if [ -z "${TEST_RUN_ID:-}" ]; then
            echo "no TEST_RUN_ID (gateway smoke did not run?); skipping residue check"
            exit 0
          fi
          TEST_RUN_ID="$TEST_RUN_ID" bash scripts/check_test_residue.sh | tee /tmp/gateway_residue.log

      # Benchmarks run before the drills: the backup drill's mysqldump competes
      # for I/O, and the seeded service database is at its most representative
      # right after the gateway suites.
      - name: Performance benchmarks
        run: bash tests/perf/bench.sh

      - name: Migration rollback drill
        run: |
          bash scripts/ci/migration_rollback_drill.sh > /tmp/migration_rollback_drill.log 2>&1
          rc=$?
          tail -20 /tmp/migration_rollback_drill.log
          exit $rc

      - name: Backup and restore drill
        run: |
          bash scripts/ci/backup_restore_drill.sh > /tmp/backup_restore_drill.log 2>&1
          rc=$?
          tail -20 /tmp/backup_restore_drill.log
          exit $rc

      - name: Schema drift check
        run: bash scripts/check_schema_drift.sh

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: test-reports
          path: artifacts/
          if-no-files-found: warn

      - name: Upload gateway log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: gateway-log
          path: /tmp/gateway_endpoints.log
          if-no-files-found: ignore

      - name: Upload drill logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: drill-logs
          path: |
            /tmp/migration_rollback_drill.log
            /tmp/backup_restore_drill.log
          if-no-files-found: ignore

      - name: Upload residue log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: gateway-residue-log
          path: /tmp/gateway_residue.log
          if-no-files-found: ignore

      - name: Collect failure diagnostics
        if: failure()
        run: bash scripts/ci/collect_diagnostics.sh /tmp/ci-diagnostics

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: diagnostics
          path: /tmp/ci-diagnostics
          if-no-files-found: warn

  db-shards:
    name: db shard ${{ matrix.shard }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Keep in sync: matrix size, DB_SHARD_COUNT below, and the shard count
    # argument of the aggregate step. Four shards split ~537 suites.
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]

    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: cobol_db
          MARIADB_USER: cobol_user
          MARIADB_PASSWORD: cobol_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: cobol_db
      DB_USER: cobol_user
      DB_PASS: cobol_pass
      DB_MIGRATE_USER: root
      DB_MIGRATE_PASS: root
      SKIP_BUILD: '1'
      # The template is the service database itself (already migrated below);
      # each shard builds exactly one private worker database from it.
      ISOLATED_DB: '0'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gnucobol libmysqlclient-dev build-essential mariadb-client

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: middleware/package-lock.json

      - name: Install gateway dependencies
        run: npm ci --prefix middleware

      - name: Download core binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: cobol-binary
          path: cobol/bin

      - name: Make binary executable
        run: chmod +x cobol/bin/main_logic

      - name: Provision least-privilege app account
        run: >
          APP_DB_PASS="$DB_PASS" MIGRATE_USER="$DB_MIGRATE_USER"
          MIGRATE_DB_PASS="$DB_MIGRATE_PASS" DB_ADMIN_USER="$DB_MIGRATE_USER"
          DB_ADMIN_PASS="$DB_MIGRATE_PASS" DB_HOST="$DB_HOST" DB_PORT="$DB_PORT"
          DB_NAME="$DB_NAME" database/grants.sh

      - name: Load baseline schema
        run: >
          mysql -h "$DB_HOST" -P "$DB_PORT"
          -u "$DB_MIGRATE_USER" -p"$DB_MIGRATE_PASS" "$DB_NAME"
          < database/schema.sql

      - name: Apply migrations
        run: ./database/migrate.sh

      - name: Run DB shard
        run: DB_SHARD_INDEX=${{ matrix.shard }} DB_SHARD_COUNT=4 tests/run_all.sh db-shard

      - name: Upload shard reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: shard-reports-${{ matrix.shard }}
          path: artifacts/
          if-no-files-found: warn

  db-aggregate:
    name: db aggregate
    needs: [test, db-shards]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '24'

      - name: Download all reports
        if: always()
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          # test-reports (test job) plus one shard-reports-N per matrix job,
          # each kept in its own subdirectory for the merge script.
          pattern: "*-reports*"
          path: parts/

      - name: Merge and verify shard reports
        if: always()
        run: bash scripts/ci/aggregate_shard_reports.sh parts merged 4

      - name: Assertion count gate
        if: always()
        run: node scripts/check_test_counts.mjs --report-dir merged --strict

      - name: Write test summary
        if: always()
        run: node scripts/ci/summary.mjs --report-dir merged

      - name: Upload merged reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: test-reports-merged
          path: merged/
          if-no-files-found: warn

  coverage:
    name: coverage
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: cobol_db
          MARIADB_USER: cobol_user
          MARIADB_PASSWORD: cobol_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: cobol_db
      DB_USER: cobol_user
      DB_PASS: cobol_pass
      DB_MIGRATE_USER: root
      DB_MIGRATE_PASS: root
      SKIP_BUILD: '1'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gnucobol libmysqlclient-dev build-essential mariadb-client

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: middleware/package-lock.json

      - name: Install gateway dependencies
        run: npm ci --prefix middleware

      - name: Download core binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: cobol-binary
          path: cobol/bin

      - name: Make binary executable
        run: chmod +x cobol/bin/main_logic

      - name: Load baseline schema
        run: >
          mysql -h "$DB_HOST" -P "$DB_PORT"
          -u "$DB_MIGRATE_USER" -p"$DB_MIGRATE_PASS" "$DB_NAME"
          < database/schema.sql

      - name: Apply migrations
        run: ./database/migrate.sh

      - name: Seed test data
        run: >
          mysql -h "$DB_HOST" -P "$DB_PORT"
          -u "$DB_USER" -p"$DB_PASS" "$DB_NAME"
          < database/seed_test_data.sql

      - name: Gateway coverage
        run: bash scripts/ci/coverage.sh --gateway-only

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  post-merge:
    name: post-merge
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: cobol_db
          MARIADB_USER: cobol_user
          MARIADB_PASSWORD: cobol_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: cobol_db
      DB_USER: cobol_user
      DB_PASS: cobol_pass
      DB_MIGRATE_USER: root
      DB_MIGRATE_PASS: root
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gnucobol libmysqlclient-dev build-essential mariadb-client
      - name: Load baseline schema
        run: >
          mysql -h "$DB_HOST" -P "$DB_PORT"
          -u "$DB_MIGRATE_USER" -p"$DB_MIGRATE_PASS" "$DB_NAME"
          < database/schema.sql
      - name: Apply migrations
        run: ./database/migrate.sh
      - name: Migration rollback drill
        run: bash scripts/ci/migration_rollback_drill.sh

      - name: Backup and restore drill
        run: bash scripts/ci/backup_restore_drill.sh

      - name: Schema drift check
        run: bash scripts/check_schema_drift.sh
  coverage-pr:
    name: coverage-pr
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: cobol_db
          MARIADB_USER: cobol_user
          MARIADB_PASSWORD: cobol_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: cobol_db
      DB_USER: cobol_user
      DB_PASS: cobol_pass
      DB_MIGRATE_USER: root
      DB_MIGRATE_PASS: root
      SKIP_BUILD: '1'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # --changed diffs against origin/main; a shallow checkout has no base.
          fetch-depth: 0

      # COBOL object cache (P1-5): coverage.sh always runs ./build.sh first and
      # reuses normal objects for the instrumented link, but a fresh checkout
      # has none. The key pins the exact toolchain (GnuCOBOL 3.2 built by
      # install_gnucobol.sh — objects must never cross compiler versions) plus
      # every build input; restore-keys fall back to the newest same-toolchain
      # cache so only changed modules recompile. The build job is deliberately
      # not cached here: it uses apt GnuCOBOL 3.1.2, and its only output (the
      # linked binary) already travels via the cobol-binary artifact.
      - name: Restore COBOL build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: cobol/build
          key: >
            cobol-build-${{ runner.os }}-gnucobol3.2-${{
            hashFiles('cobol/src/**', 'cobol/copy/**', 'cobol/c_lib/**',
            'build.sh', 'cobol/Makefile') }}
          restore-keys: |
            cobol-build-${{ runner.os }}-gnucobol3.2-

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgmp-dev libmysqlclient-dev build-essential mariadb-client

      - name: Restore GnuCOBOL toolchain
        id: gnucobol-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ~/.local/gnucobol
          # Bump the trailing v1 when scripts/ci/install_gnucobol.sh changes
          # its configure flags (a different build must not reuse this cache).
          key: gnucobol-3.2-${{ runner.os }}-v1

      - name: Install GnuCOBOL 3.2 (with --coverage)
        # Idempotent: exits in seconds when the cache hit. The apt gnucobol
        # (3.1.2) cannot do --coverage, so the coverage jobs must not use it.
        run: bash scripts/ci/install_gnucobol.sh

      - name: Expose GnuCOBOL toolchain
        run: |
          echo "$HOME/.local/gnucobol/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$HOME/.local/gnucobol/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: middleware/package-lock.json

      - name: Install gateway dependencies
        run: npm ci --prefix middleware

      - name: Load baseline schema
        run: >
          mysql -h "$DB_HOST" -P "$DB_PORT"
          -u "$DB_MIGRATE_USER" -p"$DB_MIGRATE_PASS" "$DB_NAME"
          < database/schema.sql

      - name: Apply migrations
        run: ./database/migrate.sh

      - name: Seed test data
        run: >
          mysql -h "$DB_HOST" -P "$DB_PORT"
          -u "$DB_USER" -p"$DB_PASS" "$DB_NAME"
          < database/seed_test_data.sql

      - name: Curated COBOL coverage (impact-selected)
        run: bash scripts/ci/coverage.sh --cobol-only --changed origin/main --json

      - name: Coverage summary
        if: always()
        run: node scripts/ci/coverage_summary.mjs

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: coverage-pr
          path: coverage/
          if-no-files-found: warn
