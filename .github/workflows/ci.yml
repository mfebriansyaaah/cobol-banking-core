name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: every job gets a read-only token unless it declares more
# (the CodeQL analyze job adds security-events: write for its own scope).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Single source of truth for the DB fleet size (CI-010): the db-shards
# matrix, the shard runner, and the aggregate step all read this.
# 58 suites (run `ls tests/db/*_db_tests.sh | wc -l` to recount); revisit
# if the fleet grows beyond 80.
env:
  DB_SHARD_COUNT: 2

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      # Pinned to the versions verified locally (see scripts/ci/lint.sh):
      # apt versions drift between runners and change findings.
      # Downloads are checksum-verified by scripts/ci/install-tools.sh
      # before extraction (see scripts/ci/tool-checksums.txt).
      - name: Install lint tools
        run: |
          mkdir -p "$HOME/.local/bin"
          bash scripts/ci/install-tools.sh --dest "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          pip install --break-system-packages "yamllint==1.38.0" "semgrep==1.136.0"

      - name: Install JS lint tools
        run: npm ci

      - name: Install C lint tool
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cppcheck

      - name: Shell lint
        run: bash scripts/ci/lint.sh

      - name: Strict C and cppcheck
        run: bash scripts/ci/c_strict.sh

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: Markdown lint
        run: npm run lint:md

      - name: Workflow lint
        run: actionlint

      - name: CI contract
        run: node scripts/check_ci_contract.mjs .

      - name: YAML lint
        run: bash scripts/ci/yaml_lint.sh

      - name: Validate alert rules
        run: promtool check rules monitoring/prometheus-alerts.yml

      - name: Semgrep scan
        run: >
          semgrep --config .semgrep/rules.yml --exclude node_modules
          --exclude package-lock.json --error middleware scripts

      - name: Secret scan
        run: gitleaks detect --source . --no-git --redact --config .gitleaks.toml

      - name: Gate unit tests
        run: >
          mkdir -p test-results/gate &&
          node --test --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=junit --test-reporter-destination=test-results/gate/junit.xml
          "scripts/test/*.test.mjs" 2>&1 | tail -5

      - name: Offline safety harness (no DB, no build)
        run: bash tests/scripts/run.sh

      - name: Coverage mapper unit tests
        run: python3 scripts/coverage/test_map_cobol.py

      - name: Upload gate test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: gate-tests-junit
          overwrite: true
          path: test-results/gate/junit.xml
          if-no-files-found: warn

      - name: Dependency audit (root)
        run: npm audit --omit=dev

      - name: Dependency audit (gateway)
        run: npm --prefix middleware audit --omit=dev

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gnucobol libmysqlclient-dev build-essential

      - name: Verify manifest
        run: node scripts/check_manifest.mjs .

      - name: Verify documentation
        run: node scripts/check_docs.mjs .

      - name: Complexity audit snapshot (non-gating artifact)
        run: |
          mkdir -p artifacts
          node scripts/audit_complexity.mjs --json > artifacts/complexity.json

      - name: Upload complexity snapshot
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: complexity-snapshot
          overwrite: true
          path: artifacts/complexity.json
          if-no-files-found: ignore

      - name: Gate detection probes
        run: tests/probes/run_probes.sh

      - name: SAST scan
        run: bash scripts/ci/sast.sh

      - name: SAST extra scan
        run: bash scripts/ci/sast_extra.sh

      - name: Build core
        run: |
          set -o pipefail
          ./build.sh 2>&1 | tee build.log

      - name: Check core warning ratchet
        run: scripts/check_warnings.sh build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: build-log
          overwrite: true
          path: build.log
          if-no-files-found: ignore

      - name: Upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: cobol-binary
          overwrite: true
          path: cobol/bin/main_logic
          if-no-files-found: error

  # Changed-file classifier (CI-011): docs-only PRs skip the heavy DB jobs.
  # Fails safe to full: any classifier error, empty diff, unknown path, or
  # the `ci:full` label forces `docs_only=false`.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        env:
          HAS_CI_FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: |
          if [ "$HAS_CI_FULL_LABEL" = "true" ]; then
            echo "ci:full label present; forcing full run"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="origin/main"
          fi
          if ! git rev-parse --verify --quiet "$BASE" >/dev/null; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED="$(git diff --name-only "$BASE"...HEAD)"
          CHANGED="$CHANGED
          $(git ls-files --others --exclude-standard)"
          RESULT="$(printf '%s\n' "$CHANGED" \
            | node scripts/ci/classify_changes.mjs --stdin)" \
            || RESULT="docs_only=false"
          echo "$RESULT" >> "$GITHUB_OUTPUT"

  db-snapshot:
    name: db-snapshot
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: cobol_db
          MARIADB_USER: cobol_user
          MARIADB_PASSWORD: cobol_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: cobol_db
      DB_MIGRATE_USER: root
      DB_MIGRATE_PASS: root

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mariadb-client

      - name: Load baseline schema
        run: >
          mysql -h "$DB_HOST" -P "$DB_PORT"
          -u "$DB_MIGRATE_USER" -p"$DB_MIGRATE_PASS" "$DB_NAME"
          < database/schema.sql

      - name: Apply migrations
        run: ./database/migrate.sh

      - name: Verify migration ledger
        run: ./database/migrate.sh --check

      - name: Build DB snapshot
        run: bash scripts/ci/build_db_snapshot.sh /tmp/cobol-snapshot.sql.gz

      - name: Upload DB snapshot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: db-snapshot
          overwrite: true
          path: /tmp/cobol-snapshot.sql.gz
          retention-days: 1
          if-no-files-found: error

  test:
    name: test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: cobol_db
          MARIADB_USER: cobol_user
          MARIADB_PASSWORD: cobol_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      # Email OTP flow (tests/integration/email_otp_flow.sh) delivers through
      # this in CI; locally the flow skips without it (REQUIRE_MAILPIT=1).
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: cobol_db
      DB_USER: cobol_user
      DB_PASS: cobol_pass
      DB_MIGRATE_USER: root
      DB_MIGRATE_PASS: root
      SKIP_BUILD: '1'
      REQUIRE_MAILPIT: '1'
      # The service database is already provisioned (schema + migrations) by
      # the steps below, so run_all.sh db uses it directly instead of
      # building a second isolated copy (Fase 4.2). Fuzz runs inside
      # run_all.sh full; no separate step needed (Fase 4.1).
      ISOLATED_DB: '0'
      DB_SHARDS: '4'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gnucobol libmysqlclient-dev build-essential mariadb-client

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: middleware/package-lock.json

      - name: Install gateway dependencies
        run: npm ci --prefix middleware

      - name: Download core binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: cobol-binary
          path: cobol/bin

      - name: Make binary executable
        run: chmod +x cobol/bin/main_logic

      - name: Download DB snapshot
        id: db_snapshot
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: db-snapshot
          path: /tmp/db-snapshot

      - name: Restore snapshot or rebuild schema
        run: |
          if [ "${{ steps.db_snapshot.outcome }}" = "success" ] \
              && [ -f /tmp/db-snapshot/cobol-snapshot.sql.gz ]; then
            bash scripts/ci/restore_db_snapshot.sh /tmp/db-snapshot/cobol-snapshot.sql.gz
          else
            echo "snapshot unavailable; falling back to schema + migrations"
            mysql -h "$DB_HOST" -P "$DB_PORT" -u "$DB_MIGRATE_USER" \
              -p"$DB_MIGRATE_PASS" "$DB_NAME" < database/schema.sql
            ./database/migrate.sh
          fi

      - name: Provision least-privilege app account
        run: >
          APP_DB_PASS="$DB_PASS" MIGRATE_USER="$DB_MIGRATE_USER"
          MIGRATE_DB_PASS="$DB_MIGRATE_PASS" DB_ADMIN_USER="$DB_MIGRATE_USER"
          DB_ADMIN_PASS="$DB_MIGRATE_PASS" DB_HOST="$DB_HOST" DB_PORT="$DB_PORT"
          DB_NAME="$DB_NAME" database/grants.sh

      - name: Run full test gate (DB via matrix)
        env:
          # The DB fleet runs as one-job-per-shard in db-shards below (better
          # isolation: one database per runner). This keeps one invocation
          # (and its single report.tsv) coherent; local `full` still runs db.
          SKIP_DB: '1'
        run: tests/run_all.sh full

      - name: Gateway residue check
        if: always()
        run: |
          set -o pipefail
          if [ -z "${TEST_RUN_ID:-}" ]; then
            echo "no TEST_RUN_ID (gateway smoke did not run?); skipping residue check"
            exit 0
          fi
          TEST_RUN_ID="$TEST_RUN_ID" bash scripts/check_test_residue.sh | tee /tmp/gateway_residue.log

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: test-reports
          overwrite: true
          path: artifacts/
          if-no-files-found: warn

      - name: Upload gateway log on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: gateway-log
          overwrite: true
          path: /tmp/gateway_endpoints.log
          if-no-files-found: ignore

      - name: Upload residue log on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: gateway-residue-log
          overwrite: true
          path: /tmp/gateway_residue.log
          if-no-files-found: ignore

      - name: Collect failure diagnostics
        if: failure()
        run: bash scripts/ci/collect_diagnostics.sh /tmp/ci-diagnostics

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: diagnostics
          overwrite: true
          path: /tmp/ci-diagnostics
          if-no-files-found: warn

  db-shards:
    name: db shard ${{ matrix.shard }}
    needs: [build, changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Assignment for two shards (CI-010): the LPT planner in
    # scripts/shard_suites.mjs splits ~58 suites across both runners.
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]

    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: cobol_db
          MARIADB_USER: cobol_user
          MARIADB_PASSWORD: cobol_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: cobol_db
      DB_USER: cobol_user
      DB_PASS: cobol_pass
      DB_MIGRATE_USER: root
      DB_MIGRATE_PASS: root
      SKIP_BUILD: '1'
      # The template is the service database itself (already migrated below);
      # each shard builds exactly one private worker database from it.
      ISOLATED_DB: '0'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gnucobol libmysqlclient-dev build-essential mariadb-client

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: middleware/package-lock.json

      - name: Install gateway dependencies
        run: npm ci --prefix middleware

      - name: Download core binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: cobol-binary
          path: cobol/bin

      - name: Make binary executable
        run: chmod +x cobol/bin/main_logic

      - name: Download DB snapshot
        id: db_snapshot
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: db-snapshot
          path: /tmp/db-snapshot

      - name: Restore snapshot or rebuild schema
        run: |
          if [ "${{ steps.db_snapshot.outcome }}" = "success" ] \
              && [ -f /tmp/db-snapshot/cobol-snapshot.sql.gz ]; then
            bash scripts/ci/restore_db_snapshot.sh /tmp/db-snapshot/cobol-snapshot.sql.gz
          else
            echo "snapshot unavailable; falling back to schema + migrations"
            mysql -h "$DB_HOST" -P "$DB_PORT" -u "$DB_MIGRATE_USER" \
              -p"$DB_MIGRATE_PASS" "$DB_NAME" < database/schema.sql
            ./database/migrate.sh
          fi

      - name: Provision least-privilege app account
        run: >
          APP_DB_PASS="$DB_PASS" MIGRATE_USER="$DB_MIGRATE_USER"
          MIGRATE_DB_PASS="$DB_MIGRATE_PASS" DB_ADMIN_USER="$DB_MIGRATE_USER"
          DB_ADMIN_PASS="$DB_MIGRATE_PASS" DB_HOST="$DB_HOST" DB_PORT="$DB_PORT"
          DB_NAME="$DB_NAME" database/grants.sh

      - name: Run DB shard
        run: DB_SHARD_INDEX=${{ matrix.shard }} tests/run_all.sh db-shard

      - name: Upload shard reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: shard-reports-${{ matrix.shard }}
          overwrite: true
          path: artifacts/
          if-no-files-found: warn

  db-aggregate:
    name: db aggregate
    needs: [test, db-shards, changes]
    if: always() && (github.event_name != 'pull_request' || needs.changes.outputs.docs_only != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'

      - name: Download all reports
        if: always()
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          # test-reports (test job) plus one shard-reports-N per matrix job,
          # each kept in its own subdirectory for the merge script.
          pattern: "*-reports*"
          path: parts/

      - name: Merge and verify shard reports
        if: always()
        run: bash scripts/ci/aggregate_shard_reports.sh parts merged "$DB_SHARD_COUNT"

      - name: Assertion count gate
        # If the test job did not succeed, its report is incomplete: skip
        # only the count gate with a notice instead of masking the real
        # failure with "missing suite rows / no JUnit XML".
        if: always() && needs.test.result == 'success'
        run: node scripts/check_test_counts.mjs --report-dir merged --strict

      - name: Note skipped count gate
        if: always() && needs.test.result != 'success'
        run: >
          echo "test job did not succeed (result: ${{ needs.test.result }});
          skipping the assertion-count gate — see the test job for the
          real failure"

      - name: Write test summary
        if: always()
        run: node scripts/ci/summary.mjs --report-dir merged

      - name: Upload merged reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: test-reports-merged
          overwrite: true
          path: merged/
          if-no-files-found: warn

  coverage:
    name: coverage
    # Gateway-only gate for pushes and nightly; PRs use coverage-pr instead.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: cobol_db
          MARIADB_USER: cobol_user
          MARIADB_PASSWORD: cobol_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: cobol_db
      DB_USER: cobol_user
      DB_PASS: cobol_pass
      DB_MIGRATE_USER: root
      DB_MIGRATE_PASS: root
      SKIP_BUILD: '1'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gnucobol libmysqlclient-dev build-essential mariadb-client

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: middleware/package-lock.json

      - name: Install gateway dependencies
        run: npm ci --prefix middleware

      - name: Download core binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: cobol-binary
          path: cobol/bin

      - name: Make binary executable
        run: chmod +x cobol/bin/main_logic

      - name: Download DB snapshot
        id: db_snapshot
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: db-snapshot
          path: /tmp/db-snapshot

      - name: Restore snapshot or rebuild schema
        run: |
          if [ "${{ steps.db_snapshot.outcome }}" = "success" ] \
              && [ -f /tmp/db-snapshot/cobol-snapshot.sql.gz ]; then
            bash scripts/ci/restore_db_snapshot.sh /tmp/db-snapshot/cobol-snapshot.sql.gz
          else
            echo "snapshot unavailable; falling back to schema + migrations"
            mysql -h "$DB_HOST" -P "$DB_PORT" -u "$DB_MIGRATE_USER" \
              -p"$DB_MIGRATE_PASS" "$DB_NAME" < database/schema.sql
            ./database/migrate.sh
          fi

      - name: Provision least-privilege app account
        run: >
          APP_DB_PASS="$DB_PASS" MIGRATE_USER="$DB_MIGRATE_USER"
          MIGRATE_DB_PASS="$DB_MIGRATE_PASS" DB_ADMIN_USER="$DB_MIGRATE_USER"
          DB_ADMIN_PASS="$DB_MIGRATE_PASS" DB_HOST="$DB_HOST" DB_PORT="$DB_PORT"
          DB_NAME="$DB_NAME" database/grants.sh

      - name: Seed test data
        run: >
          mysql -h "$DB_HOST" -P "$DB_PORT"
          -u "$DB_USER" -p"$DB_PASS" "$DB_NAME"
          < database/seed_test_data.sql

      - name: Gateway coverage
        run: bash scripts/ci/coverage.sh --gateway-only

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage
          overwrite: true
          path: coverage/
          if-no-files-found: ignore

  db-ops:
    name: db-ops
    needs: [build, changes]
    if: github.event_name != 'pull_request' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: cobol_db
          MARIADB_USER: cobol_user
          MARIADB_PASSWORD: cobol_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: cobol_db
      DB_USER: cobol_user
      DB_PASS: cobol_pass
      DB_MIGRATE_USER: root
      DB_MIGRATE_PASS: root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gnucobol libmysqlclient-dev build-essential mariadb-client
      - name: Download DB snapshot
        id: db_snapshot
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: db-snapshot
          path: /tmp/db-snapshot

      - name: Restore snapshot or rebuild schema
        run: |
          if [ "${{ steps.db_snapshot.outcome }}" = "success" ] \
              && [ -f /tmp/db-snapshot/cobol-snapshot.sql.gz ]; then
            bash scripts/ci/restore_db_snapshot.sh /tmp/db-snapshot/cobol-snapshot.sql.gz
          else
            echo "snapshot unavailable; falling back to schema + migrations"
            mysql -h "$DB_HOST" -P "$DB_PORT" -u "$DB_MIGRATE_USER" \
              -p"$DB_MIGRATE_PASS" "$DB_NAME" < database/schema.sql
            ./database/migrate.sh
          fi

      - name: Migration rollback drill
        run: bash scripts/ci/migration_rollback_drill.sh

      - name: Backup and restore drill
        run: bash scripts/ci/backup_restore_drill.sh

      - name: Schema drift check
        run: bash scripts/check_schema_drift.sh

  coverage-pr:
    name: coverage-pr
    if: github.event_name == 'pull_request' && needs.changes.outputs.docs_only != 'true'
    needs: [build, changes]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: cobol_db
          MARIADB_USER: cobol_user
          MARIADB_PASSWORD: cobol_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: cobol_db
      DB_USER: cobol_user
      DB_PASS: cobol_pass
      DB_MIGRATE_USER: root
      DB_MIGRATE_PASS: root
      SKIP_BUILD: '1'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # --changed diffs against origin/main; a shallow checkout has no base.
          fetch-depth: 0

      # COBOL object cache (P1-5): coverage.sh always runs ./build.sh first and
      # reuses normal objects for the instrumented link, but a fresh checkout
      # has none. The key pins the exact toolchain (GnuCOBOL 3.2 built by
      # install_gnucobol.sh — objects must never cross compiler versions) plus
      # every build input; restore-keys fall back to the newest same-toolchain
      # cache so only changed modules recompile. The build job is deliberately
      # not cached here: it uses apt GnuCOBOL 3.1.2, and its only output (the
      # linked binary) already travels via the cobol-binary artifact.
      - name: Restore COBOL build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: cobol/build
          key: >
            cobol-build-${{ runner.os }}-gnucobol3.2-${{
            hashFiles('cobol/src/**', 'cobol/copy/**', 'cobol/c_lib/**',
            'build.sh', 'cobol/Makefile', 'scripts/ci/install_gnucobol.sh') }}
          restore-keys: |
            cobol-build-${{ runner.os }}-gnucobol3.2-

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgmp-dev libmysqlclient-dev build-essential mariadb-client

      - name: Restore GnuCOBOL toolchain
        id: gnucobol-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/gnucobol
          # Bump the trailing v1 when scripts/ci/install_gnucobol.sh changes
          # its configure flags (a different build must not reuse this cache).
          key: gnucobol-3.2-${{ runner.os }}-v1

      - name: Install GnuCOBOL 3.2 (with --coverage)
        # Idempotent: exits in seconds when the cache hit. The apt gnucobol
        # (3.1.2) cannot do --coverage, so the coverage jobs must not use it.
        run: bash scripts/ci/install_gnucobol.sh

      - name: Expose GnuCOBOL toolchain
        run: |
          echo "$HOME/.local/gnucobol/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$HOME/.local/gnucobol/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: middleware/package-lock.json

      - name: Install gateway dependencies
        run: npm ci --prefix middleware

      - name: Download DB snapshot
        id: db_snapshot
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: db-snapshot
          path: /tmp/db-snapshot

      - name: Restore snapshot or rebuild schema
        run: |
          if [ "${{ steps.db_snapshot.outcome }}" = "success" ] \
              && [ -f /tmp/db-snapshot/cobol-snapshot.sql.gz ]; then
            bash scripts/ci/restore_db_snapshot.sh /tmp/db-snapshot/cobol-snapshot.sql.gz
          else
            echo "snapshot unavailable; falling back to schema + migrations"
            mysql -h "$DB_HOST" -P "$DB_PORT" -u "$DB_MIGRATE_USER" \
              -p"$DB_MIGRATE_PASS" "$DB_NAME" < database/schema.sql
            ./database/migrate.sh
          fi

      - name: Provision least-privilege app account
        run: >
          APP_DB_PASS="$DB_PASS" MIGRATE_USER="$DB_MIGRATE_USER"
          MIGRATE_DB_PASS="$DB_MIGRATE_PASS" DB_ADMIN_USER="$DB_MIGRATE_USER"
          DB_ADMIN_PASS="$DB_MIGRATE_PASS" DB_HOST="$DB_HOST" DB_PORT="$DB_PORT"
          DB_NAME="$DB_NAME" database/grants.sh

      - name: Seed test data
        run: >
          mysql -h "$DB_HOST" -P "$DB_PORT"
          -u "$DB_USER" -p"$DB_PASS" "$DB_NAME"
          < database/seed_test_data.sql

      - name: Curated COBOL coverage (impact-selected)
        run: bash scripts/ci/coverage.sh --cobol-only --changed origin/main --json

      - name: Coverage summary
        if: always()
        run: node scripts/ci/coverage_summary.mjs

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage-pr
          overwrite: true
          path: coverage/
          if-no-files-found: warn
