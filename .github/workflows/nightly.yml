name: Nightly

# Full fleet twice plus drills, on a schedule. Two consecutive full runs must
# produce identical results; any difference fails the workflow and is reported
# as a possible flake. PRs are unaffected.
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  full-twice:
    name: full twice + drills
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: cobol_db
          MARIADB_USER: cobol_user
          MARIADB_PASSWORD: cobol_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: cobol_db
      DB_USER: cobol_user
      DB_PASS: cobol_pass
      DB_MIGRATE_USER: root
      DB_MIGRATE_PASS: root
      SKIP_BUILD: '1'
      ISOLATED_DB: '0'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Both full runs share the same warm objects; the cache also survives
      # night-to-night when only a few modules changed.
      - name: Restore COBOL build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: cobol/build
          key: >
            cobol-build-${{ runner.os }}-gnucobol3.2-${{
            hashFiles('cobol/src/**', 'cobol/copy/**', 'cobol/c_lib/**',
            'build.sh', 'cobol/Makefile', 'scripts/ci/install_gnucobol.sh') }}
          restore-keys: |
            cobol-build-${{ runner.os }}-gnucobol3.2-

      - name: Install runtime dependencies
        run: |
          set -euo pipefail
          sudo timeout 240 apt-get install -y --no-install-recommends \
            libgmp-dev libmariadb-dev libmariadb-dev-compat build-essential mariadb-client || {
            sudo timeout 120 apt-get update
            sudo timeout 240 apt-get install -y --no-install-recommends \
              libgmp-dev libmariadb-dev libmariadb-dev-compat build-essential mariadb-client
          }

      - name: Setup GnuCOBOL
        uses: ./.github/actions/setup-cobol

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            middleware/package-lock.json

      - name: Install JS dependencies (gateway + load-test runner)
        run: |
          npm ci --prefix middleware --no-audit --no-fund
          npm ci --no-audit --no-fund

      - name: Bootstrap database
        uses: ./.github/actions/db-bootstrap
        with:
          use-snapshot: 'false'

      - name: Build core
        run: |
          set -o pipefail
          ./build.sh 2>&1 | tee build.log

      - name: Full run 1 of 2
        run: REPORT_DIR=artifacts/nightly-run1 tests/run_all.sh --json full

      - name: Stash run 1 report
        if: always()
        run: |
          mkdir -p nightly
          cp artifacts/nightly-run1/run-all.json nightly/run1.json 2>/dev/null || echo "no run-all.json from run 1"

      - name: Write run 1 summary
        if: always()
        run: node scripts/ci/summary.mjs --report-dir artifacts/nightly-run1

      - name: Full run 2 of 2
        run: REPORT_DIR=artifacts/nightly-run2 tests/run_all.sh --json full

      - name: Stash run 2 report
        if: always()
        run: |
          cp artifacts/nightly-run2/run-all.json nightly/run2.json 2>/dev/null || echo "no run-all.json from run 2"

      - name: Write run 2 summary
        if: always()
        run: node scripts/ci/summary.mjs --report-dir artifacts/nightly-run2

      - name: Compare runs (flake gate)
        run: node scripts/ci/compare_runs.mjs nightly/run1.json nightly/run2.json

      - name: Compare runs in summary
        if: always()
        run: |
          set -o pipefail
          if [ -f nightly/run1.json ] && [ -f nightly/run2.json ]; then
            node scripts/ci/compare_runs.mjs nightly/run1.json nightly/run2.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "compare skipped: run1 or run2 report missing (upstream failure)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Migration rollback drill
        run: bash scripts/ci/migration_rollback_drill.sh

      - name: Backup and restore drill
        run: bash scripts/ci/backup_restore_drill.sh

      - name: Schema drift check
        run: bash scripts/check_schema_drift.sh

      - name: Gateway coverage
        run: bash scripts/ci/coverage.sh --gateway-only --json

      - name: Performance benchmarks
        run: bash tests/perf/bench.sh

      - name: Gateway load test
        run: bash tests/perf/load_gateway.sh

      - name: Upload nightly reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: nightly-reports
          overwrite: true
          path: |
            artifacts/
            nightly/
            coverage/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload failure diagnostics
        if: failure()
        uses: ./.github/actions/upload-diagnostics
        with:
          name: diagnostics-nightly

  notify:
    name: notify
    needs: [full-twice]
    if: always() && needs.full-twice.result != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Open or close CI failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          WORKFLOW_NAME: ${{ github.workflow }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          FAILED_JOBS: ${{ toJSON(needs) }}
        run: bash scripts/ci/notify_failure.sh "${{ needs.full-twice.result }}"
