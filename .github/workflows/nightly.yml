name: Nightly

# Full fleet twice plus drills, on a schedule (P1-5). Two consecutive full
# runs must produce identical results; any difference fails the workflow and
# is reported as a possible flake. PRs are unaffected (this never blocks
# them); failures here mean the fleet is order-dependent or flaky.
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

# Own group: a push must not cancel a running nightly (or vice versa).
concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  full-twice:
    name: full twice + drills
    runs-on: ubuntu-latest
    timeout-minutes: 180

    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: cobol_db
          MARIADB_USER: cobol_user
          MARIADB_PASSWORD: cobol_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: cobol_db
      DB_USER: cobol_user
      DB_PASS: cobol_pass
      DB_MIGRATE_USER: root
      DB_MIGRATE_PASS: root
      SKIP_BUILD: '1'
      ISOLATED_DB: '0'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gnucobol libmysqlclient-dev build-essential mariadb-client

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: middleware/package-lock.json

      - name: Install gateway dependencies
        run: npm ci --prefix middleware

      - name: Install JS toolchain (load test runner)
        run: npm ci

      - name: Provision least-privilege app account
        run: >
          APP_DB_PASS="$DB_PASS" MIGRATE_USER="$DB_MIGRATE_USER"
          MIGRATE_DB_PASS="$DB_MIGRATE_PASS" DB_ADMIN_USER="$DB_MIGRATE_USER"
          DB_ADMIN_PASS="$DB_MIGRATE_PASS" DB_HOST="$DB_HOST" DB_PORT="$DB_PORT"
          DB_NAME="$DB_NAME" database/grants.sh

      - name: Load baseline schema
        run: >
          mysql -h "$DB_HOST" -P "$DB_PORT"
          -u "$DB_MIGRATE_USER" -p"$DB_MIGRATE_PASS" "$DB_NAME"
          < database/schema.sql

      - name: Apply migrations
        run: ./database/migrate.sh

      - name: Build core
        run: |
          set -o pipefail
          ./build.sh 2>&1 | tee build.log

      - name: Full run 1 of 2
        run: REPORT_DIR=artifacts/nightly-run1 tests/run_all.sh --json full

      - name: Stash run 1 report
        if: always()
        run: |
          mkdir -p nightly
          cp artifacts/nightly-run1/run-all.json nightly/run1.json 2>/dev/null || echo "no run-all.json from run 1"

      - name: Full run 2 of 2
        run: REPORT_DIR=artifacts/nightly-run2 tests/run_all.sh --json full

      - name: Stash run 2 report
        if: always()
        run: |
          cp artifacts/nightly-run2/run-all.json nightly/run2.json 2>/dev/null || echo "no run-all.json from run 2"

      - name: Compare runs (flake gate)
        run: node scripts/ci/compare_runs.mjs nightly/run1.json nightly/run2.json

      - name: Migration rollback drill
        run: bash scripts/ci/migration_rollback_drill.sh

      - name: Backup and restore drill
        run: bash scripts/ci/backup_restore_drill.sh

      - name: Schema drift check
        run: bash scripts/check_schema_drift.sh

      - name: Gateway coverage
        run: bash scripts/ci/coverage.sh --gateway-only --json

      - name: Performance benchmarks
        run: bash tests/perf/bench.sh

      - name: Gateway load test
        run: bash tests/perf/load_gateway.sh

      - name: Collect failure diagnostics
        if: failure()
        run: bash scripts/ci/collect_diagnostics.sh /tmp/ci-diagnostics

      - name: Upload nightly reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: nightly-reports
          overwrite: true
          path: |
            artifacts/
            nightly/
            coverage/
          if-no-files-found: warn

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: nightly-diagnostics
          overwrite: true
          path: /tmp/ci-diagnostics
          if-no-files-found: warn
