name: Mutation

# Money-path mutation gate: each mutant neuters one guard; the mapped suite
# MUST fail. Any survivor fails the run. Weekly plus manual dispatch.
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: mutation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mutants:
    name: money-path mutants
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: cobol_db
          MARIADB_USER: cobol_user
          MARIADB_PASSWORD: cobol_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: cobol_db
      DB_USER: cobol_user
      DB_PASS: cobol_pass
      DB_MIGRATE_USER: root
      DB_MIGRATE_PASS: root

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Warm objects make each mutant a one-module recompile + relink instead
      # of a full rebuild.
      - name: Restore COBOL build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: cobol/build
          key: >
            cobol-build-${{ runner.os }}-gnucobol3.2-${{
            hashFiles('cobol/src/**', 'cobol/copy/**', 'cobol/c_lib/**',
            'build.sh', 'cobol/Makefile', 'scripts/ci/install_gnucobol.sh') }}
          restore-keys: |
            cobol-build-${{ runner.os }}-gnucobol3.2-

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: middleware/package-lock.json

      - name: Install runtime dependencies
        run: |
          set -euo pipefail
          sudo timeout 240 apt-get install -y --no-install-recommends \
            libgmp-dev libmariadb-dev libmariadb-dev-compat build-essential mariadb-client git python3 || {
            sudo timeout 120 apt-get update
            sudo timeout 240 apt-get install -y --no-install-recommends \
              libgmp-dev libmariadb-dev libmariadb-dev-compat build-essential mariadb-client git python3
          }
          npm ci --prefix middleware --no-audit --no-fund

      - name: Setup GnuCOBOL
        uses: ./.github/actions/setup-cobol

      - name: Seed test database
        run: |
          mysql -h "$DB_HOST" -P "$DB_PORT" -u "$DB_MIGRATE_USER" -p"$DB_MIGRATE_PASS" "$DB_NAME" < database/schema.sql
          ./database/migrate.sh

      - name: Validate mutant anchors
        run: bash tests/probes/money_path_mutants.sh --check-anchors

      - name: Run money-path mutants
        run: bash tests/probes/money_path_mutants.sh

  notify:
    name: notify
    needs: [mutants]
    if: always() && needs.mutants.result != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Open or close CI failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          WORKFLOW_NAME: ${{ github.workflow }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          FAILED_JOBS: ${{ toJSON(needs) }}
        run: bash scripts/ci/notify_failure.sh "${{ needs.mutants.result }}"
