name: CodeQL

# Security scan of the JavaScript gateway and the C crypto helpers.
# COBOL has no CodeQL extractor; the C bridge is self-contained (libc only).
#
# Path filters keep CodeQL off docs/config-only changes. The weekly schedule
# is unfiltered and keeps the configuration exercised.
on:
  push:
    branches: [main]
    paths:
      - 'middleware/**'
      - 'cobol/c_lib/**'
      - '.github/workflows/codeql.yml'
  pull_request:
    paths:
      - 'middleware/**'
      - 'cobol/c_lib/**'
      - '.github/workflows/codeql.yml'
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

# Cancel superseded PR analyses, but never cancel a main/schedule run.
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [javascript, cpp]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066  # v3
        with:
          languages: ${{ matrix.language }}

      # JS/TS is extracted from source; autobuild adds a step without
      # compiling anything. Only the C bridge needs a traced build.
      - name: Trace C bridge build
        if: matrix.language == 'cpp'
        run: |
          mkdir -p /tmp/codeql-c
          gcc -c -I cobol/c_lib -o /tmp/codeql-c/hash_lib.o cobol/c_lib/hash_lib.c
          gcc -c -I cobol/c_lib -o /tmp/codeql-c/totp_lib.o cobol/c_lib/totp_lib.c
          gcc -c -I cobol/c_lib -o /tmp/codeql-c/settings_lib.o cobol/c_lib/settings_lib.c
          gcc -c -I cobol/c_lib -o /tmp/codeql-c/random_lib.o cobol/c_lib/random_lib.c

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066  # v3
        with:
          category: '/language:${{ matrix.language }}'
