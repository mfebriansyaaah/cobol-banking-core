name: CodeQL

# Security scan of the JavaScript gateway and the C crypto helpers (P1-6).
# COBOL itself is out of scope (no CodeQL extractor exists); the C bridge is
# limited to cobol/c_lib (self-contained: libc only, no mysql headers needed),
# traced with the same gcc the build uses.
# NOTE: repository is public, so GHAS code scanning is available. The weekly
# schedule keeps the configuration exercised; PR/push triggers run the same
# analysis on every change.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

# Own group: a push must not cancel a running CodeQL analysis (or vice versa).
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [javascript, cpp]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26  # v3
        with:
          languages: ${{ matrix.language }}

      - if: matrix.language == 'cpp'
        name: Trace C bridge build
        run: |
          mkdir -p /tmp/codeql-c
          gcc -c -I cobol/c_lib -o /tmp/codeql-c/hash_lib.o cobol/c_lib/hash_lib.c
          gcc -c -I cobol/c_lib -o /tmp/codeql-c/totp_lib.o cobol/c_lib/totp_lib.c
          gcc -c -I cobol/c_lib -o /tmp/codeql-c/settings_lib.o cobol/c_lib/settings_lib.c
          gcc -c -I cobol/c_lib -o /tmp/codeql-c/random_lib.o cobol/c_lib/random_lib.c

      - if: matrix.language != 'cpp'
        name: Autobuild
        uses: github/codeql-action/autobuild@1fc58d04a4d4374f921bdac573c3811c240f9c26  # v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26  # v3
        with:
          category: '/language:${{ matrix.language }}'
