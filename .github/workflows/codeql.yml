name: CodeQL

# Security scan of the JavaScript gateway and the C crypto helpers (P1-6).
# COBOL itself is out of scope (no CodeQL extractor exists); the C bridge is
# limited to cobol/c_lib (self-contained: libc only, no mysql headers needed),
# traced with the same gcc the build uses.
# NOTE: PR/push triggers are intentionally absent. This is a private repo
# without GitHub Advanced Security, so the analyze step cannot upload results
# (code scanning is not enabled) and would fail every run. The workflow runs
# on schedule so the configuration stays exercised; restore pull_request +
# push triggers once GHAS/code scanning is enabled in repo settings.
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [javascript, cpp]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@4bfa242aa49c5f7c6770b98670d354a7dfac05f8  # v3
        with:
          languages: ${{ matrix.language }}

      - if: matrix.language == 'cpp'
        name: Trace C bridge build
        run: |
          mkdir -p /tmp/codeql-c
          gcc -c -I cobol/c_lib -o /tmp/codeql-c/hash_lib.o cobol/c_lib/hash_lib.c
          gcc -c -I cobol/c_lib -o /tmp/codeql-c/totp_lib.o cobol/c_lib/totp_lib.c
          gcc -c -I cobol/c_lib -o /tmp/codeql-c/settings_lib.o cobol/c_lib/settings_lib.c
          gcc -c -I cobol/c_lib -o /tmp/codeql-c/random_lib.o cobol/c_lib/random_lib.c

      - if: matrix.language != 'cpp'
        name: Autobuild
        uses: github/codeql-action/autobuild@4bfa242aa49c5f7c6770b98670d354a7dfac05f8  # v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@4bfa242aa49c5f7c6770b98670d354a7dfac05f8  # v3
        with:
          category: '/language:${{ matrix.language }}'
